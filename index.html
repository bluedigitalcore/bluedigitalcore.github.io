<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blue Digital Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
/* ============================================================
   CONTENT: everything brand-specific lives here.
   To reskin: change colors, logo text, copy, links.
   Nothing below the config needs to be touched.
   ============================================================ */
const CONTENT = {

  brand: {
    logoText: "BLUE DIGITAL",
    logoAccent: "CORE",
    colors: {
      accent:     "#2440f0",              // the blue. buttons, highlights, price
      accentDark: "#1b31c2",              // button hover
      accentSoft: "#e9edfe",              // soft blue fills
      bg:         "#fbfaf7",              // near-white page background
      surface:    "#ffffff",              // cards
      ink:        "#0e1118",              // deep ink text and dark band
      inkText:    "#f4f5f9",              // text on ink background
      textMuted:  "#565b6b",              // secondary text
      border:     "#e6e4dd"               // hairlines
    }
  },

  hero: {
    headline: "Your PDF freebie is leaving half your leads on the table.",
    highlight: "half your leads",         // phrase inside headline that gets the blue underline
    subhead: "I build custom quiz funnels and AI DM assistants for coaches. Your branding, your domain, no monthly tool fees. You approve the full blueprint before I build a thing.",
    buttonLabel: "See a live demo",
    buttonHref: "#demo"
  },

  // The signature element: a working one-question mini quiz in the hero.
  miniQuiz: {
    label: "Quick question",
    question: "What's your current lead magnet?",
    options: [
      {
        label: "A PDF",
        response: "Around 20 percent conversion. You're leaving half on the table.",
        buttonLabel: "See the math",
        buttonHref: "#why"
      },
      {
        label: "A quiz",
        response: "Smart. Now imagine it custom, on your own domain, no monthly fees.",
        buttonLabel: "See pricing",
        buttonHref: "#pricing"
      },
      {
        label: "Honestly, nothing",
        response: "Clean slate. You get to start with the thing that converts double.",
        buttonLabel: "See how it works",
        buttonHref: "#how"
      }
    ]
  },

  demo: {
    kicker: "Live demo",
    title: "Try it like your audience would.",
    body: "This is a working demo I built for a fictional coach. Take it on your phone, that's where your leads live.",
    buttonLabel: "Take the demo quiz",
    url: "https://bluedigitalcore.github.io/sellableco-quiz/"
  },

  why: {
    kicker: "Why quizzes",
    // The cinematic scene: scrolling scrubs the big number from 20 to 40
    // while the stat sentences float in and out at their scroll windows.
    // "in"/"out" are scroll progress points (0 to 1) where a line fades.
    scene: {
      from: 20,
      to: 40,
      lines: [
        { text: "PDF lead magnets convert around 20 percent.", in: -1,   out: 0.3 },
        { text: "Quizzes average around 40.",                  in: 0.36, out: 0.62 },
        { text: "Same traffic, double the emails.",            in: 0.68, out: 9 }
      ]
    },
    paragraphs: [
      "And a quiz tells you who's ready to buy before you ever talk to them.",
      "Tools like involve.me charge up to $99 a month for a template. I build yours custom, on your own domain, once."
    ]
  },

  how: {
    kicker: "How it works",
    steps: [
      {
        title: "The blueprint.",
        body: "You tell me about your offer and audience. I map your full quiz: questions, result types, the flow. You see everything before paying for the build."
      },
      {
        title: "The build.",
        body: "Custom coded in your branding, connected to your email list. Days, not weeks."
      },
      {
        title: "Live.",
        body: "It runs on your domain. No subscriptions, no per-contact pricing, it's yours."
      }
    ]
  },

  pricing: {
    kicker: "Pricing",
    cards: [
      {
        name: "The Quiz Funnel",
        price: "$1,450",
        priceNote: "one time",
        features: [
          "Custom quiz in your branding, on your domain",
          "Email capture wired to your list",
          "Three result types with tailored CTAs",
          "Blueprint approved by you first"
        ],
        featured: false
      },
      {
        name: "The Lead Machine",
        price: "$2,200",
        priceNote: "one time plus $99 a month hosting",
        features: [
          "Everything in the Quiz Funnel",
          "An AI DM assistant that replies in your voice 24/7",
          "Delivers your quiz link",
          "Answers questions while you sleep"
        ],
        featured: true,                   // highlighted by default
        badge: "Most selected"            // sticker on the card, stays put on click
      }
    ]
  },

  contact: {
    buttonLabel: "Contact me",
    email: "hello@repona.ai",
    subject: "Quiz funnel"
  },

  faq: {
    kicker: "FAQ",
    items: [
      {
        q: "Do we need to get on a call?",
        a: "No. Everything runs in writing. You get a full blueprint to approve, most clients prefer it."
      },
      {
        q: "What do you need from me?",
        a: "Access nobody should ever give: none. Your email tool connects through its own integrations, your Instagram through Meta's official partner access. No passwords, ever."
      },
      {
        q: "How long does it take?",
        a: "Blueprint within 48 hours of your answers. Build, 3 to 5 days after approval."
      },
      {
        q: "What if I don't like the blueprint?",
        a: "Then you don't pay for a build. The blueprint round is where we get it right."
      }
    ]
  },

  footer: {
    name: "Blue Digital Core",
    emailLabel: "Email:",
    email: "hello@repona.ai",
    note: "Not interested in emails from me? One reply and you're off my list."
  }
};
/* ================== END CONTENT ================== */
</script>

<style>
  :root { /* colors are injected from CONTENT by JS */ }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.65;
    overflow-x: hidden;
  }

  .display {
    font-family: "Bricolage Grotesque", "Inter", -apple-system, sans-serif;
    font-weight: 800;
    line-height: 1.04;
    letter-spacing: -0.015em;
  }

  .container {
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
    padding: 0 24px;
  }

  section { padding: 84px 0; }

  .kicker {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--accent);
    margin-bottom: 18px;
  }
  .kicker::before {
    content: "";
    display: inline-block;
    width: 22px;
    height: 2px;
    background: var(--accent);
    vertical-align: middle;
    margin-right: 10px;
  }

  h2.display {
    font-size: clamp(30px, 7.5vw, 44px);
    margin-bottom: 16px;
  }

  /* ---------- buttons ---------- */
  .btn {
    display: inline-block;
    padding: 17px 34px;
    font-size: 16.5px;
    font-weight: 700;
    font-family: inherit;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    text-decoration: none;
    transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:hover {
    background: var(--accent-dark);
    transform: translateY(-2px);
    box-shadow: 0 10px 28px color-mix(in srgb, var(--accent) 32%, transparent);
  }
  .btn:active { transform: translateY(0); box-shadow: none; }

  .btn-ghost {
    display: inline-block;
    padding: 15px 30px;
    font-size: 16px;
    font-weight: 600;
    color: var(--ink);
    background: transparent;
    border: 1.5px solid var(--border);
    border-radius: 999px;
    text-decoration: none;
    transition: border-color 0.18s ease, color 0.18s ease, transform 0.18s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-2px); }

  /* ---------- header ---------- */
  header { padding: 22px 0; }
  .logo {
    font-family: "Bricolage Grotesque", "Inter", sans-serif;
    font-weight: 800;
    letter-spacing: 0.1em;
    font-size: 14px;
  }
  .logo span { color: var(--accent); }

  /* ---------- hero ---------- */
  #hero { padding: 40px 0 96px; }

  #hero h1 {
    font-size: clamp(40px, 11vw, 74px);
    margin-bottom: 22px;
  }
  #hero h1 .hl {
    font-style: normal;
    background-image: linear-gradient(var(--accent), var(--accent));
    background-repeat: no-repeat;
    background-size: 100% 0.14em;
    background-position: 0 96%;
  }
  #hero .subhead {
    font-size: 17.5px;
    color: var(--text-muted);
    max-width: 56ch;
    margin-bottom: 40px;
  }

  /* hero load reveal: one orchestrated stagger */
  .hero-item {
    opacity: 0;
    transform: translateY(22px);
    animation: rise 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  header .hero-item { animation-delay: 0.05s; }
  #hero .subhead.hero-item { animation-delay: 0.55s; }
  #hero .mini-quiz.hero-item { animation-delay: 0.7s; }
  #hero .hero-alt.hero-item { animation-delay: 0.85s; }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }

  /* the headline types itself letter by letter */
  #hero h1 .word { display: inline-block; white-space: nowrap; }
  #hero h1 .ch {
    display: inline-block;
    opacity: 0;
    transform: translateY(0.4em) rotate(5deg);
    animation: chIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  @keyframes chIn {
    to { opacity: 1; transform: translateY(0) rotate(0deg); }
  }

  /* thin scroll progress bar, fixed to the top edge */
  .scroll-progress {
    position: fixed;
    top: 0;
    left: 0;
    height: 3px;
    width: 0;
    background: var(--accent);
    z-index: 60;
    pointer-events: none;
  }

  /* ---------- mini quiz (signature element) ---------- */
  .mini-quiz {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 26px 24px;
    box-shadow: 0 20px 50px -18px rgba(14, 17, 24, 0.14);
  }
  .mq-label {
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--accent);
    margin-bottom: 10px;
  }
  .mq-question {
    font-family: "Bricolage Grotesque", "Inter", sans-serif;
    font-weight: 700;
    font-size: 21px;
    line-height: 1.25;
    margin-bottom: 18px;
  }
  .mq-options { display: flex; flex-direction: column; gap: 10px; }
  .mq-option {
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    text-align: left;
    color: var(--ink);
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: 999px;
    padding: 14px 22px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease, transform 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .mq-option:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
  .mq-option.selected {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .mq-result { display: none; padding-top: 20px; }
  .mq-result.show { display: block; animation: pop 0.4s cubic-bezier(0.22, 1, 0.36, 1); }
  @keyframes pop {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .mq-response {
    font-family: "Bricolage Grotesque", "Inter", sans-serif;
    font-weight: 700;
    font-size: 19px;
    line-height: 1.35;
    margin-bottom: 16px;
  }
  .mq-response::before {
    content: "";
    display: block;
    width: 34px;
    height: 3px;
    background: var(--accent);
    border-radius: 2px;
    margin-bottom: 14px;
  }

  .hero-alt { margin-top: 26px; }

  /* ---------- scroll reveal ---------- */
  .reveal {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1), transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .reveal.in { opacity: 1; transform: translateY(0); }

  /* ---------- demo (dark band) ---------- */
  #demo {
    background:
      radial-gradient(640px 340px at 85% -10%, color-mix(in srgb, var(--accent) 36%, transparent), transparent 70%),
      var(--ink);
    color: var(--ink-text);
    padding: 96px 0;
  }
  #demo .kicker { color: var(--ink-text); opacity: 0.9; }
  #demo .kicker::before { background: var(--accent); }
  #demo p {
    color: var(--ink-text);
    opacity: 0.72;
    font-size: 17.5px;
    max-width: 52ch;
    margin-bottom: 36px;
  }
  #demo .btn { width: 100%; text-align: center; font-size: 17.5px; padding: 19px 34px; }
  #demo .btn:hover { box-shadow: 0 12px 34px color-mix(in srgb, var(--accent) 55%, transparent); }

  /* ---------- why ---------- */
  #why p {
    font-size: 17px;
    color: var(--text-muted);
    max-width: 58ch;
    margin-bottom: 18px;
  }
  #why p:first-of-type {
    font-family: "Bricolage Grotesque", "Inter", sans-serif;
    font-weight: 700;
    font-size: clamp(21px, 5.5vw, 27px);
    line-height: 1.3;
    color: var(--ink);
  }
  /* the sticky cinematic scene: scroll scrubs the number and the lines */
  #why { padding: 0 0 100px; }
  .scene { height: 240vh; }
  .scene-sticky {
    position: sticky;
    top: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    overflow: hidden;
  }
  .scene-number {
    font-size: clamp(96px, 30vw, 220px);
    color: var(--accent);
    line-height: 0.9;
    letter-spacing: -0.04em;
    margin: 12px 0 30px;
    transform-origin: left center;
    font-variant-numeric: tabular-nums;
    will-change: transform;
  }
  .scene-lines {
    position: relative;
    min-height: 4.4em;
    font-size: clamp(21px, 6vw, 30px);
  }
  .scene-line {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    font-family: "Bricolage Grotesque", "Inter", sans-serif;
    font-weight: 700;
    line-height: 1.3;
    opacity: 0;
    will-change: opacity, transform;
  }
  #whyBelow { padding-top: 44px; }

  /* ---------- how (sticky scene: steps open in sequence on scroll) ---------- */
  #how { padding: 0; }
  .scene--how { height: 220vh; }
  .step {
    position: relative;
    padding: 0 0 36px 58px;
  }
  #how .step { opacity: 0; will-change: opacity, transform; }
  .step:last-child { padding-bottom: 0; }
  .step::before {
    content: "";
    position: absolute;
    left: 19px;
    top: 42px;
    bottom: 0;
    width: 2px;
    background: var(--border);
  }
  .step::after {
    content: "";
    position: absolute;
    left: 19px;
    top: 42px;
    bottom: 0;
    width: 2px;
    background: var(--accent);
    transform: scaleY(var(--line, 0));
    transform-origin: top;
  }
  .step:last-child::before,
  .step:last-child::after { display: none; }
  .step-num {
    position: absolute;
    left: 0;
    top: 0;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Bricolage Grotesque", "Inter", sans-serif;
    font-size: 16px;
    font-weight: 800;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 50%;
    transition: background 0.3s ease, color 0.3s ease;
  }
  .step.on .step-num { background: var(--accent); color: #fff; }
  .step h3 {
    font-family: "Bricolage Grotesque", "Inter", sans-serif;
    font-weight: 800;
    font-size: 21px;
    margin: 6px 0 6px;
  }
  .step p { color: var(--text-muted); font-size: 16.5px; max-width: 52ch; }

  /* ---------- pricing ---------- */
  .cards {
    display: grid;
    grid-template-columns: 1fr;
    gap: 22px;
    margin-top: 12px;
  }
  .card {
    position: relative;
    background: var(--surface);
    border: 2px solid var(--border);
    border-radius: 24px;
    padding: 34px 28px;
    transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.25s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .card.selected {
    border-color: var(--accent);
    box-shadow: 0 24px 60px -24px color-mix(in srgb, var(--accent) 38%, transparent);
  }
  .card-badge {
    position: absolute;
    top: -14px;
    right: 22px;
    font-size: 11.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #fff;
    background: var(--accent);
    padding: 7px 15px;
    border-radius: 999px;
    transform: rotate(2deg);
    box-shadow: 0 6px 16px color-mix(in srgb, var(--accent) 35%, transparent);
  }
  .card h3 {
    font-family: "Bricolage Grotesque", "Inter", sans-serif;
    font-weight: 800;
    font-size: 22px;
    margin-bottom: 14px;
  }
  .price {
    font-family: "Bricolage Grotesque", "Inter", sans-serif;
    font-size: 44px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: var(--accent);
    line-height: 1;
  }
  .price-note { font-size: 14.5px; color: var(--text-muted); margin: 8px 0 24px; }
  .card ul { list-style: none; }
  .card li {
    font-size: 15.5px;
    color: var(--text-muted);
    padding: 10px 0 10px 28px;
    position: relative;
  }
  .card li + li { border-top: 1px solid var(--border); }
  .card li::before {
    content: "";
    position: absolute;
    left: 2px;
    top: 19px;
    width: 12px;
    height: 7px;
    border-left: 2.5px solid var(--accent);
    border-bottom: 2.5px solid var(--accent);
    transform: rotate(-45deg);
  }
  .pricing-cta { text-align: center; margin-top: 40px; }

  /* ---------- faq ---------- */
  .faq-item { border-bottom: 1px solid var(--border); }
  .faq-item summary {
    list-style: none;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    padding: 22px 0;
    font-size: 17px;
    font-weight: 600;
    transition: color 0.15s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .faq-item summary:hover { color: var(--accent); }
  .faq-item summary::-webkit-details-marker { display: none; }
  .faq-item summary::after {
    content: "+";
    flex: none;
    font-family: "Bricolage Grotesque", "Inter", sans-serif;
    font-size: 26px;
    font-weight: 600;
    color: var(--accent);
    line-height: 1;
    transition: transform 0.25s ease;
  }
  .faq-item[open] summary::after { transform: rotate(45deg); }
  .faq-item .answer {
    padding: 0 0 24px;
    font-size: 16px;
    color: var(--text-muted);
    max-width: 56ch;
  }

  /* ---------- end cta + footer ---------- */
  #end-cta { text-align: center; padding: 40px 0 96px; }
  #end-cta .btn { font-size: 17.5px; padding: 19px 40px; }

  footer {
    border-top: 1px solid var(--border);
    padding: 46px 0 60px;
    font-size: 14px;
    color: var(--text-muted);
  }
  footer .name {
    font-family: "Bricolage Grotesque", "Inter", sans-serif;
    font-weight: 800;
    font-size: 15px;
    color: var(--ink);
    margin-bottom: 6px;
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }
  footer .note { margin-top: 10px; }

  /* ---------- desktop ---------- */
  @media (min-width: 720px) {
    .container { max-width: 1020px; }
    section { padding: 120px 0; }
    #hero { padding: 72px 0 130px; }

    .hero-grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 64px;
      align-items: center;
    }
    #hero .subhead { margin-bottom: 0; }
    .hero-alt { margin-top: 30px; }

    .narrow { max-width: 660px; }

    #demo .btn { width: auto; }

    .cards { grid-template-columns: 1fr 1fr; align-items: start; gap: 28px; }
    .card { padding: 40px 36px; }
    .card.selected { transform: translateY(-8px); }
  }

  /* ---------- reduced motion ---------- */
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .hero-item { animation: none; opacity: 1; transform: none; }
    #hero h1 .ch { animation: none; opacity: 1; transform: none; }
    .reveal { transition: none; opacity: 1; transform: none; }
    .mq-result.show { animation: none; }
    .btn, .btn-ghost, .mq-option, .card { transition: none; }
    .btn:hover, .btn-ghost:hover, .mq-option:hover { transform: none; }
    .scroll-progress { display: none; }
    /* the scenes flatten into normal, fully visible content */
    .scene { height: auto; }
    .scene-sticky { position: static; height: auto; overflow: visible; }
    .scene-lines { min-height: 0; }
    .scene-line { position: static; opacity: 1; transform: none; margin-bottom: 12px; }
    .scene-number { transform: none; }
    #how { padding: 84px 0; }
    #how .step { opacity: 1; transform: none; }
    .step::after { display: none; }
    .step-num { transition: none; }
  }
</style>
</head>
<body>

<div class="scroll-progress" id="scrollProgress"></div>

<header>
  <div class="container"><div class="logo hero-item" id="logo"></div></div>
</header>

<section id="hero">
  <div class="container">
    <div class="hero-grid">
      <div>
        <h1 class="display" id="heroHeadline"></h1>
        <p class="subhead hero-item" id="heroSubhead"></p>
      </div>
      <div>
        <div class="mini-quiz hero-item" id="miniQuiz">
          <p class="mq-label" id="mqLabel"></p>
          <p class="mq-question" id="mqQuestion"></p>
          <div class="mq-options" id="mqOptions"></div>
          <div class="mq-result" id="mqResult">
            <p class="mq-response" id="mqResponse"></p>
            <a class="btn" id="mqBtn"></a>
          </div>
        </div>
        <div class="hero-alt hero-item">
          <a class="btn-ghost" id="heroBtn"></a>
        </div>
      </div>
    </div>
  </div>
</section>

<section id="demo">
  <div class="container narrow">
    <span class="kicker reveal" id="demoKicker"></span>
    <h2 class="display reveal" id="demoTitle"></h2>
    <p class="reveal" id="demoBody"></p>
    <div class="reveal"><a class="btn" id="demoBtn" target="_blank" rel="noopener"></a></div>
  </div>
</section>

<section id="why">
  <div class="scene" id="whyScene">
    <div class="scene-sticky">
      <div class="container narrow">
        <span class="kicker" id="whyKicker"></span>
        <div class="scene-number display" id="sceneNumber"></div>
        <div class="scene-lines" id="sceneLines"></div>
      </div>
    </div>
  </div>
  <div class="container narrow" id="whyBelow">
    <div id="whyParagraphs"></div>
  </div>
</section>

<section id="how">
  <div class="scene scene--how" id="howScene">
    <div class="scene-sticky">
      <div class="container narrow">
        <span class="kicker" id="howKicker"></span>
        <div class="steps" id="howSteps"></div>
      </div>
    </div>
  </div>
</section>

<section id="pricing">
  <div class="container">
    <span class="kicker reveal" id="pricingKicker"></span>
    <div class="cards" id="pricingCards"></div>
    <div class="pricing-cta reveal"><a class="btn" id="pricingContact"></a></div>
  </div>
</section>

<section id="faq">
  <div class="container narrow">
    <span class="kicker reveal" id="faqKicker"></span>
    <div id="faqItems"></div>
  </div>
</section>

<div id="end-cta">
  <div class="container">
    <a class="btn reveal" id="endContact"></a>
  </div>
</div>

<footer>
  <div class="container">
    <p class="name" id="footerName"></p>
    <p id="footerEmail"></p>
    <p class="note" id="footerNote"></p>
  </div>
</footer>

<script src="https://unpkg.com/lenis@1.3.21/dist/lenis.min.js"></script>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const C = CONTENT;
  const REDUCED = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ----- apply brand colors from config ----- */
  const cs = C.brand.colors;
  const rs = document.documentElement.style;
  rs.setProperty("--accent", cs.accent);
  rs.setProperty("--accent-dark", cs.accentDark);
  rs.setProperty("--accent-soft", cs.accentSoft);
  rs.setProperty("--bg", cs.bg);
  rs.setProperty("--surface", cs.surface);
  rs.setProperty("--ink", cs.ink);
  rs.setProperty("--ink-text", cs.inkText);
  rs.setProperty("--text-muted", cs.textMuted);
  rs.setProperty("--border", cs.border);

  /* ----- header ----- */
  $("logo").innerHTML = C.brand.logoText + " <span>" + C.brand.logoAccent + "</span>";

  /* ----- hero headline: types itself letter by letter, the
           highlight phrase keeps the blue underline ----- */
  (function buildHeadline() {
    const el = $("heroHeadline");
    const headline = C.hero.headline;
    const hl = C.hero.highlight;
    const segs = [];
    if (hl && headline.includes(hl)) {
      const pre = headline.slice(0, headline.indexOf(hl));
      const post = headline.slice(headline.indexOf(hl) + hl.length);
      if (pre.trim()) segs.push({ t: pre.trim(), hl: false });
      segs.push({ t: hl.trim(), hl: true });
      if (post.trim()) segs.push({ t: post.trim(), hl: false });
    } else {
      segs.push({ t: headline, hl: false });
    }
    const words = [];
    segs.forEach(sg => sg.t.split(/\s+/).forEach(w => words.push({ w, hl: sg.hl })));
    let ci = 0;
    words.forEach((wo, wi) => {
      if (wi) el.appendChild(document.createTextNode(" "));
      const span = document.createElement("span");
      span.className = "word" + (wo.hl ? " hl" : "");
      [...wo.w].forEach(chr => {
        const c = document.createElement("span");
        c.className = "ch";
        c.textContent = chr;
        c.style.animationDelay = (0.15 + ci * 0.016).toFixed(3) + "s";
        ci++;
        span.appendChild(c);
      });
      el.appendChild(span);
    });
  })();
  $("heroSubhead").textContent = C.hero.subhead;
  $("heroBtn").textContent = C.hero.buttonLabel;
  $("heroBtn").href = C.hero.buttonHref;

  /* ----- mini quiz ----- */
  $("mqLabel").textContent = C.miniQuiz.label;
  $("mqQuestion").textContent = C.miniQuiz.question;
  C.miniQuiz.options.forEach(opt => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "mq-option";
    b.textContent = opt.label;
    b.addEventListener("click", () => {
      document.querySelectorAll(".mq-option").forEach(x => x.classList.remove("selected"));
      b.classList.add("selected");
      $("mqResponse").textContent = opt.response;
      $("mqBtn").textContent = opt.buttonLabel;
      $("mqBtn").href = opt.buttonHref;
      const r = $("mqResult");
      r.classList.remove("show");
      void r.offsetWidth; /* restart the pop animation on re-answer */
      r.classList.add("show");
    });
    $("mqOptions").appendChild(b);
  });

  /* ----- demo ----- */
  $("demoKicker").textContent = C.demo.kicker;
  $("demoTitle").textContent = C.demo.title;
  $("demoBody").textContent = C.demo.body;
  $("demoBtn").textContent = C.demo.buttonLabel;
  $("demoBtn").href = C.demo.url;

  /* ----- why: the scroll-scrubbed scene + the remaining paragraphs ----- */
  $("whyKicker").textContent = C.why.kicker;
  const scene = C.why.scene;
  $("sceneNumber").textContent = (REDUCED ? scene.to : scene.from) + "%";
  scene.lines.forEach(line => {
    const d = document.createElement("div");
    d.className = "scene-line";
    d.dataset.in = line.in;
    d.dataset.out = line.out;
    d.textContent = line.text;
    $("sceneLines").appendChild(d);
  });
  C.why.paragraphs.forEach(text => {
    const p = document.createElement("p");
    p.className = "reveal";
    p.textContent = text;
    $("whyParagraphs").appendChild(p);
  });

  /* scene engine: maps scroll progress to the number and line opacity */
  function sceneUpdate() {
    const wrap = $("whyScene");
    const rect = wrap.getBoundingClientRect();
    const scrollable = rect.height - window.innerHeight;
    if (scrollable <= 0) return;
    if (rect.bottom < 0 || rect.top > window.innerHeight) return;
    const p = Math.max(0, Math.min(1, -rect.top / scrollable));
    $("sceneNumber").textContent = Math.round(scene.from + (scene.to - scene.from) * p) + "%";
    $("sceneNumber").style.transform = "scale(" + (1 + p * 0.1).toFixed(3) + ")";
    document.querySelectorAll(".scene-line").forEach(el => {
      const a = parseFloat(el.dataset.in), b = parseFloat(el.dataset.out);
      const fadeIn = Math.max(0, Math.min(1, (p - a) / 0.12));
      const fadeOut = 1 - Math.max(0, Math.min(1, (p - b) / 0.12));
      const o = fadeIn * fadeOut;
      el.style.opacity = o.toFixed(3);
      el.style.transform = "translateY(" + ((1 - o) * 24).toFixed(1) + "px)";
    });
  }

  /* ----- how: steps open one by one as the scene is scrolled ----- */
  $("howKicker").textContent = C.how.kicker;
  C.how.steps.forEach((s, i) => {
    const step = document.createElement("div");
    step.className = "step";
    const num = document.createElement("div");
    num.className = "step-num";
    num.textContent = i + 1;
    const title = document.createElement("h3");
    title.textContent = s.title;
    const p = document.createElement("p");
    p.textContent = s.body;
    step.append(num, title, p);
    $("howSteps").appendChild(step);
  });

  /* how scene engine: each step fades in at its own scroll window,
     then its connector line draws down toward the next step */
  function howUpdate() {
    const wrap = $("howScene");
    const rect = wrap.getBoundingClientRect();
    const scrollable = rect.height - window.innerHeight;
    if (scrollable <= 0) return;
    if (rect.bottom < 0 || rect.top > window.innerHeight) return;
    const p = Math.max(0, Math.min(1, -rect.top / scrollable));
    document.querySelectorAll("#howSteps .step").forEach((el, i) => {
      const start = 0.06 + i * 0.3;
      const o = Math.max(0, Math.min(1, (p - start) / 0.14));
      el.style.opacity = o.toFixed(3);
      el.style.transform = "translateY(" + ((1 - o) * 28).toFixed(1) + "px)";
      el.classList.toggle("on", o > 0.5);
      const line = Math.max(0, Math.min(1, (p - (start + 0.12)) / 0.16));
      el.style.setProperty("--line", line.toFixed(3));
    });
  }

  /* ----- pricing (informational; clicking a card just moves the
           highlight so a curious tap gets visual feedback) ----- */
  $("pricingKicker").textContent = C.pricing.kicker;
  C.pricing.cards.forEach(card => {
    const el = document.createElement("div");
    el.className = "card reveal" + (card.featured ? " selected" : "");
    if (card.badge) {
      const badge = document.createElement("span");
      badge.className = "card-badge";
      badge.textContent = card.badge;
      el.appendChild(badge);
    }
    const name = document.createElement("h3");
    name.textContent = card.name;
    const price = document.createElement("div");
    price.className = "price";
    price.textContent = card.price;
    const note = document.createElement("p");
    note.className = "price-note";
    note.textContent = card.priceNote;
    const ul = document.createElement("ul");
    card.features.forEach(f => {
      const li = document.createElement("li");
      li.textContent = f;
      ul.appendChild(li);
    });
    el.append(name, price, note, ul);
    el.addEventListener("click", () => {
      document.querySelectorAll(".card").forEach(x => x.classList.remove("selected"));
      el.classList.add("selected");
    });
    $("pricingCards").appendChild(el);
  });

  const mailto = "mailto:" + C.contact.email + "?subject=" + encodeURIComponent(C.contact.subject);
  $("pricingContact").textContent = C.contact.buttonLabel;
  $("pricingContact").href = mailto;
  $("endContact").textContent = C.contact.buttonLabel;
  $("endContact").href = mailto;

  /* ----- faq ----- */
  $("faqKicker").textContent = C.faq.kicker;
  C.faq.items.forEach(item => {
    const d = document.createElement("details");
    d.className = "faq-item reveal";
    const s = document.createElement("summary");
    s.textContent = item.q;
    const a = document.createElement("div");
    a.className = "answer";
    a.textContent = item.a;
    d.append(s, a);
    $("faqItems").appendChild(d);
  });

  /* ----- footer ----- */
  $("footerName").textContent = C.footer.name;
  $("footerEmail").innerHTML = C.footer.emailLabel + ' <a href="mailto:' + C.footer.email + '">' + C.footer.email + "</a>";
  $("footerNote").textContent = C.footer.note;

  /* ----- scroll reveals ----- */
  if (REDUCED || !("IntersectionObserver" in window)) {
    document.querySelectorAll(".reveal").forEach(el => el.classList.add("in"));
  } else {
    const io = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (!e.isIntersecting) return;
        e.target.classList.add("in");
        io.unobserve(e.target);
      });
    }, { threshold: 0.15, rootMargin: "0px 0px -40px 0px" });
    document.querySelectorAll(".reveal").forEach(el => io.observe(el));
  }

  /* ----- smooth scroll engine (Lenis) + scene + progress bar ----- */
  if (!REDUCED) {
    const lenis = window.Lenis ? new Lenis({ lerp: 0.09, smoothWheel: true }) : null;
    if (lenis) {
      window.__lenis = lenis;
      document.documentElement.style.scrollBehavior = "auto";
      document.addEventListener("click", e => {
        const a = e.target.closest('a[href^="#"]');
        if (!a || a.getAttribute("href").length < 2) return;
        const target = document.querySelector(a.getAttribute("href"));
        if (!target) return;
        e.preventDefault();
        lenis.scrollTo(target, { offset: -10 });
      });
    }
    const progress = $("scrollProgress");
    function raf(t) {
      if (lenis) lenis.raf(t);
      sceneUpdate();
      howUpdate();
      const max = document.documentElement.scrollHeight - window.innerHeight;
      progress.style.width = (max > 0 ? (window.scrollY / max * 100) : 0).toFixed(2) + "%";
      requestAnimationFrame(raf);
    }
    requestAnimationFrame(raf);
  }
})();
</script>
</body>
</html>
